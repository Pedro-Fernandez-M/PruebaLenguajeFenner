<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel docente — Evaluación diagnóstica</title>
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>

<header class="barra" id="barra" hidden>
  <div class="marca">Panel docente <span>Evaluación diagnóstica</span></div>
  <nav class="fila">
    <a href="#pruebas">Pruebas</a>
    <a href="#alumnos">Alumnos y códigos</a>
  </nav>
  <div class="espacio"></div>
  <span id="docente" class="silencio"></span>
  <button id="btn-salir" class="neutro chico">Salir</button>
</header>

<main id="acceso" class="centrado">
  <div class="tarjeta">
    <h1>Panel docente</h1>
    <p class="silencio">Ingresa con tu correo institucional para crear pruebas y revisar resultados.</p>
    <div id="aviso-acceso" class="aviso"></div>
    <form id="form-acceso">
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" style="width:100%">Ingresar</button>
    </form>
  </div>
  <p class="silencio" style="text-align:center"><a href="/">Ir al ingreso de alumnos</a></p>
</main>

<main id="panel" class="contenido" hidden></main>

<script type="module" src="/js/profesor.js"></script>
</body>
</html>
